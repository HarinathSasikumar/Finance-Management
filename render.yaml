services:
  # Backend — Node.js Express API
  - type: web
    name: rwdm-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false        # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false        # Set to your Vercel frontend URL after deploying frontend

  # Frontend — React + Vite (Static Site)
  - type: web
    name: rwdm-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false        # Set to your Render backend URL + /api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
